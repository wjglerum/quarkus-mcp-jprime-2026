quarkus.application.name=conference-chat
quarkus.http.port=8082
quarkus.http.access-log.enabled=true

quarkus.oidc.application-type=web-app
quarkus.oidc.client-id=conference-chat
quarkus.oidc.credentials.secret=conference-chat-secret
quarkus.oidc.authentication.redirect-path=/
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.authentication.pkce-required=true
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.token.refresh-expired=true

quarkus.http.auth.permission.assets.paths=/chat.css,/chat.js,/favicon.ico,/q/*
quarkus.http.auth.permission.assets.policy=permit
quarkus.http.auth.permission.chat.paths=/api/*,/
quarkus.http.auth.permission.chat.policy=authenticated

quarkus.keycloak.devservices.realm-path=../keycloak-realm.json
quarkus.keycloak.devservices.realm-name=jprime
quarkus.keycloak.devservices.service-name=jprime-keycloak
quarkus.keycloak.devservices.shared=true

quarkus.langchain4j.mcp.conference.transport-type=http
quarkus.langchain4j.mcp.conference.url=${CONFERENCE_MCP_URL:http://localhost:8081/mcp/sse}
quarkus.langchain4j.mcp.conference.log-requests=true
quarkus.langchain4j.mcp.conference.log-responses=true

chat.llm.provider=${CHAT_LLM_PROVIDER:scripted}

quarkus.langchain4j.claude.chat-model.provider=anthropic
quarkus.langchain4j.anthropic.claude.chat-model.model-name=claude-haiku-4-5-20251001
quarkus.langchain4j.anthropic.claude.api-key=not-set

quarkus.langchain4j.gpt.chat-model.provider=openai
quarkus.langchain4j.openai.gpt.chat-model.model-name=gpt-4o-mini
quarkus.langchain4j.openai.gpt.api-key=not-set

quarkus.langchain4j.llama.chat-model.provider=ollama
quarkus.langchain4j.ollama.llama.chat-model.model-id=${OLLAMA_MODEL:llama3.1:8b}
quarkus.langchain4j.devservices.preload=false

%dev.demo.now=${DEMO_NOW:2026-06-03T10:45:00+03:00}
demo.now=${DEMO_NOW:}

%test.quarkus.http.test-port=0
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.langchain4j.mcp.health.enabled=false
%test.quarkus.langchain4j.devservices.enabled=false
%test.quarkus.langchain4j.mcp.conference.transport-type=stdio
%test.quarkus.langchain4j.mcp.conference.command=sh,-c,sleep 600
