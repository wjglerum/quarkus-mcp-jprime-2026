quarkus.application.name=conference-chat
quarkus.http.port=8084

# OIDC -- web-app mode. Browser hits "/", gets redirected to Keycloak, comes
# back with a session cookie. The user's bearer token is then available to
# inject into outbound REST calls.
quarkus.oidc.application-type=web-app
quarkus.oidc.client-id=conference-mcp
quarkus.oidc.credentials.secret=conference-mcp-secret
quarkus.oidc.authentication.scopes=openid,profile,email,attendee,speaker
quarkus.oidc.authentication.redirect-path=/
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.authentication.pkce-required=true
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.token.refresh-expired=true

# Public assets and the health endpoints stay open so the login redirect can
# load JS / CSS before the user is authenticated.
quarkus.http.auth.permission.assets.paths=/index.html,/chat.css,/chat.js,/favicon.ico,/q/*
quarkus.http.auth.permission.assets.policy=permit
quarkus.http.auth.permission.chat.paths=/api/*,/
quarkus.http.auth.permission.chat.policy=authenticated

# Shared Keycloak Dev Service container (joins conference-api + conference-mcp).
quarkus.keycloak.devservices.realm-path=keycloak-realm.json
quarkus.keycloak.devservices.realm-name=jprime
quarkus.keycloak.devservices.start-command=start-dev --import-realm --features=token-exchange
quarkus.keycloak.devservices.service-name=jprime-keycloak
quarkus.keycloak.devservices.shared=true

# REST clients into conference-api -- the user's bearer rides along via the
# token propagation provider.
quarkus.rest-client.conference-api-public.url=${CONFERENCE_API_URL:http://localhost:8080}
quarkus.rest-client.conference-api-me.url=${CONFERENCE_API_URL:http://localhost:8080}

# LangChain4j MCP client -- connects to conference-mcp so tool lookup uses
# the real MCP wire protocol. Used by the LLM toggle.
quarkus.langchain4j.mcp.conference.transport-type=http
quarkus.langchain4j.mcp.conference.url=${CONFERENCE_MCP_URL:http://localhost:8082/mcp/sse}

# LangChain4j Anthropic. Disabled by default so the demo boots with no API
# key. Flip chat.llm.enabled=true and set ANTHROPIC_API_KEY to turn it on.
quarkus.langchain4j.anthropic.chat-model.model-name=claude-haiku-4-5-20251001
quarkus.langchain4j.anthropic.api-key=${ANTHROPIC_API_KEY:dummy}
chat.llm.enabled=${CHAT_LLM_ENABLED:false}

# Demo clock forwarded by tools when set.
demo.now=${DEMO_NOW:}

%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.keycloak.devservices.enabled=false
