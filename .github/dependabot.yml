version: 2
updates:
  - package-ecosystem: maven
    directories:
      - /conference-api
      - /conference-mcp
      - /conference-chat
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
