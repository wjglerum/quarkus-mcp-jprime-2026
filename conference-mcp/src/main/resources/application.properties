quarkus.application.name=conference-mcp
quarkus.http.port=8082

# OIDC: validate access tokens issued by Keycloak. In dev, OIDC is disabled so
# the demo MCP client can poke around before Keycloak comes up.
quarkus.oidc.application-type=service
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8081/realms/jprime}
%prod.quarkus.oidc.client-id=${OIDC_CLIENT_ID:conference-mcp}
%prod.quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:conference-mcp-secret}
quarkus.oidc.roles.role-claim-path=realm_access/roles
%dev.quarkus.oidc.tenant-enabled=false
%dev.quarkus.http.auth.proactive=false

# Conference API REST clients
quarkus.rest-client.conference-api-public.url=${CONFERENCE_API_URL:http://localhost:8080}
quarkus.rest-client.conference-api-me.url=${CONFERENCE_API_URL:http://localhost:8080}

# MCP server
quarkus.mcp.server.server-info.name=jPrime 2026 Conference Companion
quarkus.mcp.server.server-info.version=1.0.0

# Demo clock override forwarded by tools when set
demo.now=${DEMO_NOW:}
