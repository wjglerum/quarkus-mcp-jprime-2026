# === Application & HTTP ===
quarkus.application.name=conference-mcp
quarkus.http.port=8081
quarkus.http.access-log.enabled=true
quarkus.http.access-log.exclude-pattern=(/q/.*)|(.*\\.(css|js|map|ico|png|svg|jpe?g|gif|woff2?|ttf|eot))
%test.quarkus.http.test-port=0

# === MCP server ===
quarkus.mcp.server.server-info.name=jPrime 2026 Conference Companion
quarkus.mcp.server.server-info.version=1.0.0

# === Security ===
quarkus.http.auth.permission.mcp.paths=/mcp,/mcp/*
quarkus.http.auth.permission.mcp.policy=mcp-scope
quarkus.http.auth.policy.mcp-scope.roles-allowed=attendee

quarkus.oidc.resource-metadata.enabled=true
quarkus.oidc.resource-metadata.scopes=attendee
quarkus.oidc.resource-metadata.force-https-scheme=false

# Dev and test wire the authorization server automatically (Keycloak Dev Services / wiremock);
# prod must point at a real Keycloak. Service mode validates JWTs against the JWKS, so no
# client id or secret is needed.
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}

# === Keycloak Dev Services (dev) ===
quarkus.keycloak.devservices.realm-path=../keycloak-realm.json
quarkus.keycloak.devservices.realm-name=jprime
quarkus.keycloak.devservices.service-name=jprime-keycloak
quarkus.keycloak.devservices.shared=true
quarkus.keycloak.devservices.features=cimd

# Tests swap Keycloak for an in-memory provider
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.oidc.auth-server-url=${keycloak.url}/realms/quarkus

# === Downstream conference API ===
quarkus.rest-client.conference-api-public.url=${CONFERENCE_API_URL:http://localhost:8080}
quarkus.rest-client.conference-api-me.url=${CONFERENCE_API_URL:http://localhost:8080}

# === Demo clock ===
%dev.demo.now=${DEMO_NOW:2026-06-03T10:45:00+03:00}
demo.now=${DEMO_NOW:}
