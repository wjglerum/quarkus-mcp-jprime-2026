quarkus.application.name=conference-mcp
quarkus.http.port=8081
quarkus.http.access-log.enabled=true
# Skip management endpoints and static assets to keep the access log readable.
quarkus.http.access-log.exclude-pattern=(/q/.*)|(.*\\.(css|js|map|ico|png|svg|jpe?g|gif|woff2?|ttf|eot))

quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8081/realms/jprime}
%prod.quarkus.oidc.client-id=${OIDC_CLIENT_ID:conference-mcp}
%prod.quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:conference-mcp-secret}

quarkus.keycloak.devservices.realm-path=../keycloak-realm.json
quarkus.keycloak.devservices.realm-name=jprime
quarkus.keycloak.devservices.service-name=jprime-keycloak
quarkus.keycloak.devservices.shared=true
# Enable the experimental Keycloak CIMD feature (Client ID Metadata Documents, SEP-991).
# With this on, Keycloak accepts a URL as the client_id and fetches the client metadata
# document at that URL instead of requiring Dynamic Client Registration.
quarkus.keycloak.devservices.features=cimd

%dev.quarkus.http.auth.proactive=false
%dev.quarkus.oidc.client-id=conference-mcp
%dev.quarkus.oidc.credentials.secret=conference-mcp-secret

# Advertise OAuth 2.0 Protected Resource Metadata (RFC 9728) so MCP clients such as
# MCP Inspector can discover the authorization server and run Dynamic Client Registration.
# force-https-scheme is off because the demo runs on plain HTTP localhost.
%dev.quarkus.oidc.resource-metadata.enabled=true
%dev.quarkus.oidc.resource-metadata.force-https-scheme=false

%test.quarkus.http.test-port=0
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.keycloak.devservices.enabled=false

quarkus.rest-client.conference-api-public.url=${CONFERENCE_API_URL:http://localhost:8080}
quarkus.rest-client.conference-api-me.url=${CONFERENCE_API_URL:http://localhost:8080}

quarkus.mcp.server.server-info.name=jPrime 2026 Conference Companion
quarkus.mcp.server.server-info.version=1.0.0

%dev.demo.now=${DEMO_NOW:2026-06-03T10:45:00+03:00}
demo.now=${DEMO_NOW:}
