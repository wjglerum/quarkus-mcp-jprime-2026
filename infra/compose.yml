name: jprime-mcp-demo

services:
  postgres:
    image: postgres:16-alpine
    container_name: jprime-postgres
    environment:
      POSTGRES_USER: conference
      POSTGRES_PASSWORD: conference
      POSTGRES_DB: conference
    ports:
      - "5432:5432"
    volumes:
      - jprime-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conference -d conference"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: jprime-keycloak
    command:
      - start-dev
      - --import-realm
      - --features=token-exchange,admin-fine-grained-authz,dynamic-scopes,client-policies
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8081"
    ports:
      - "8081:8081"
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/jprime-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8081 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | head -1 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  jprime-pg-data:
