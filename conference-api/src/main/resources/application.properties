quarkus.application.name=conference-api
quarkus.http.port=8080

# Database (Dev Services in dev/test; explicit config in prod via env)
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USERNAME:conference}
%prod.quarkus.datasource.password=${DB_PASSWORD:conference}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/conference}

# Hibernate -- Flyway owns the schema, so we don't validate against it.
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration,classpath:seed

# OIDC (bearer-only). Dev Services boots Keycloak in dev; prod points at compose Keycloak.
quarkus.oidc.application-type=service
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8081/realms/jprime}
%prod.quarkus.oidc.client-id=${OIDC_CLIENT_ID:conference-api}
%prod.quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:conference-api-secret}
%prod.quarkus.oidc.token.audience=conference-api
quarkus.oidc.roles.role-claim-path=realm_access/roles

# In dev mode allow unauthenticated requests to make it easy to poke around with curl.
%dev.quarkus.http.auth.proactive=false
%dev.quarkus.oidc.tenant-enabled=false
%test.quarkus.oidc.tenant-enabled=false
%test.jprime.importer.enabled=false

# OpenAPI
quarkus.smallrye-openapi.info-title=jPrime 2026 Conference API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Backing data API for the jPrime 2026 MCP demo
quarkus.swagger-ui.always-include=true

# jPrime importer
jprime.agenda.url=${JPRIME_AGENDA_URL:https://jprime.io/agenda}
jprime.importer.enabled=${JPRIME_IMPORTER_ENABLED:true}

# Demo clock override (Europe/Sofia). Used by /sessions/current and /sessions/next.
demo.now=${DEMO_NOW:}
