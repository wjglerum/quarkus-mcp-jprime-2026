quarkus.application.name=conference-api
quarkus.http.port=8080

# Database -- Dev Services boots a Postgres container automatically in dev and test.
# Override via env in prod if needed; no compose file is shipped with the demo.
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USERNAME:conference}
%prod.quarkus.datasource.password=${DB_PASSWORD:conference}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/conference}

# Hibernate -- Flyway owns the schema, so we don't validate against it.
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration,classpath:seed

# OIDC -- bearer-only. Dev Services boots Keycloak with the realm imported.
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8081/realms/jprime}
%prod.quarkus.oidc.client-id=${OIDC_CLIENT_ID:conference-api}
%prod.quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:conference-api-secret}
%prod.quarkus.oidc.token.audience=conference-api

# Keycloak Dev Services -- imports our realm so attendee1 / willem.jan exist
# from boot. Shared across both Quarkus apps via the same service-name.
quarkus.keycloak.devservices.realm-path=keycloak-realm.json
quarkus.keycloak.devservices.realm-name=jprime
quarkus.keycloak.devservices.start-command=start-dev --import-realm --features=token-exchange
quarkus.keycloak.devservices.service-name=jprime-keycloak
quarkus.keycloak.devservices.shared=true

# Dev convenience: allow anonymous requests through so curl / Swagger UI work.
# Endpoints that require a role still 401/403 without a real bearer token.
%dev.quarkus.http.auth.proactive=false

# Dev UI OIDC card -- lets you press "Log in" from /q/dev/ and exchange
# attendee1 / willem.jan / admin-demo passwords for a real bearer token, then
# call the secured endpoints right from the Dev UI / Swagger UI.
%dev.quarkus.oidc.client-id=conference-mcp
%dev.quarkus.oidc.credentials.secret=conference-mcp-secret

%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.keycloak.devservices.enabled=false
%test.jprime.importer.enabled=false

# OpenAPI
quarkus.smallrye-openapi.info-title=jPrime 2026 Conference API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Backing data API for the jPrime 2026 MCP demo
quarkus.swagger-ui.always-include=true

# Allow embedding the live audit dashboard cross-origin in the demo client.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,DELETE,OPTIONS

# jPrime importer
jprime.agenda.url=${JPRIME_AGENDA_URL:https://jprime.io/agenda}
jprime.importer.enabled=${JPRIME_IMPORTER_ENABLED:true}

# Demo clock override (Europe/Sofia). Used by /sessions/current and /sessions/next.
demo.now=${DEMO_NOW:}
